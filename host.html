<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主持 · 小天才搶答器</title></head>
<body style="margin:0;font-family:PingFang TC,sans-serif;background:#fff6e8;padding:24px"><p id="m">🎮 載入主持頁…</p>
<script>
(async function(){
  try{
    var r=await fetch("host.gz.b64?v=43");
    if(!r.ok)throw new Error("host.gz.b64");
    var b64=await r.text();
    var bin=Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0)});
    var ds=new DecompressionStream("gzip");
    var stream=new Response(bin).body.pipeThrough(ds);
    var html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById("m").textContent="載入失敗："+e.message+"。請重新整理。";
  }
})();
</script></body></html>
