<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>主持 · 小天才搶答器</title>
<style>
:root{--bg:#fff6e8;--card:#fff;--line:#ffd6a5;--pri:#ff8c42;--ok:#2ecc71;--bad:#e74c3c;--text:#2c3e50;--muted:#7f8c8d;--orange:#ff8c42}
*{box-sizing:border-box}
body{margin:0;font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px}
.wrap{max-width:720px;margin:0 auto}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 0 rgba(255,140,66,.15)}
.title{font-size:18px;font-weight:800;margin:0 0 8px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.code{font-size:36px;font-weight:900;letter-spacing:.2em;color:var(--pri);margin:4px 0}
input,textarea,button{font:inherit}
input,textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
button{border:0;border-radius:12px;padding:10px 14px;background:#ffe8d1;color:var(--text);font-weight:700;cursor:pointer}
button.primary{background:var(--pri);color:#fff}
button.danger{background:#ffe0e0;color:#c0392b}
button:active{transform:scale(.98)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
#qbank{font-size:15px;font-weight:600;min-height:80px;resize:vertical;border:2px dashed var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.qbank-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.scores{display:flex;flex-direction:column;gap:8px}
.score-row{display:flex;align-items:center;justify-content:space-between;background:#fff3e0;border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.score-actions{display:inline-flex;align-items:center;gap:8px}
.score-num{font-weight:800;min-width:2.4em;text-align:center;font-size:18px}
.btn-adj{min-height:36px;min-width:44px;padding:0 10px;font-size:15px;font-weight:800;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--text);cursor:pointer}
.btn-adj:active{transform:scale(.96)}
#records{max-height:200px;overflow:auto;font-size:13px}
.rec{padding:6px 0;border-bottom:1px dashed #f0d0a8}
#qrcode{width:148px;height:148px;background:#fff;padding:8px;border-radius:16px;border:3px dashed var(--pri);margin:0 auto}
#qrcode img{display:block;width:128px;height:128px}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#fff;border:2px solid #ffe0b8;font-weight:800;font-size:13px}
.error{color:var(--bad);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<header style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">
<p style="margin:0;font-weight:900;font-size:18px">🎮 小天才搶答器 · 主持</p>
<span class="status-pill" id="status">準備中</span>
</header>

<!-- QR + 房號 放最前 -->
<div class="card">
<div class="row">
<div style="flex:0 0 auto;text-align:center">
<p class="hint">🔑 房號（4位）</p>
<p class="code" id="room">----</p>
<button type="button" class="danger" id="new-room" style="margin-top:6px">🏠 開新房</button>
</div>
<div style="flex:1;min-width:180px">
<p class="hint">🔗 選手連結</p>
<div style="display:flex;gap:8px;margin-top:4px">
<input id="join-url" readonly style="font-size:13px">
<button id="copy" type="button">📋 複製</button>
</div>
<p class="hint">選手掃 QR 或貼連結入房</p>
</div>
<div style="flex:0 0 auto">
<div id="qrcode"></div>
<p class="hint" style="text-align:center;margin-top:4px">📱 掃碼入房</p>
</div>
</div>
</div>

<div class="card"><p class="title">📚 題目清單（一行一題）</p>
<textarea id="qbank" rows="3" placeholder="貼上題目，每行一題&#10;例：&#10;1+1等於幾？&#10;香港特首係邊個？"></textarea>
<div class="qbank-bar">
<button type="button" id="qbank-load">📥 載入清單</button>
<button type="button" class="primary" id="qbank-next">➡️ 下一題</button>
<button type="button" id="qbank-prev">⬅️ 上一題</button>
</div>
<p class="hint" id="qbank-status">未載入題目 · 載入後可一鍵換題</p>
</div>

<div class="card"><p class="title">📝 本輪題目</p>
<textarea id="question" rows="2" placeholder="輸入或由清單載入題目" maxlength="200"></textarea>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
<button class="primary" id="start" type="button">▶️ 開始搶答</button>
<button id="pause" type="button">⏸️ 暫停</button>
<button id="next" type="button">⏭️ 下一輪</button>
</div>
<p class="error" id="error"></p>
</div>

<div class="card"><p class="title">🏆 分數（可調整）</p>
<div class="scores" id="scores"></div>
<div style="margin-top:10px"><button class="danger" id="reset" type="button">🧹 清空分數</button></div>
</div>

<div class="card"><p class="title">⚡ 本輪搶答</p><div id="buzzes"></div></div>
<div class="card"><p class="title">📋 答題紀錄</p><div id="records"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ably@1.2.50/build/ably.min.js"></script>
<script>
(function(){
var KEY="Nta7rA.R_3OIg:p4OAZ8Z8_mgfKaLTDl1rPWiKn7aMb12txQ2H2s8EuLo";
var ALPH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function makeRoom(){var c="";for(var i=0;i<4;i++)c+=ALPH[Math.floor(Math.random()*ALPH.length)];return c}
function normalizeRoom(r){var c=String(r||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4);return /^[A-Z0-9]{4}$/.test(c)?c:""}

var params=new URLSearchParams(location.search);
var room=normalizeRoom(params.get("room"))||makeRoom();
if(!params.get("room")||normalizeRoom(params.get("room"))!==room){
  var u=new URL(location.href);u.search="?room="+room;history.replaceState(null,"",u.pathname+u.search);
}
document.getElementById("room").textContent=room;

var questionEl=document.getElementById("question"),errorEl=document.getElementById("error"),statusEl=document.getElementById("status");
var scores={},buzzes=[],fouls=[],passed={},forgiven={},lastQr="",qTimer=0,qBank=[],qBankIdx=-1;
var phase="closed",question="",answerActive=false,answerUs=0,records=[],channel=null,ably=null;

function playerUrl(){var u=new URL("index.html",location.href);u.search="?room="+room;return u.toString()}
function parseQBank(text){return String(text||"").split(/\r?\n/).map(function(l){return l.replace(/^\s*[0-9]+[.)、.\s]+/,"").trim()}).filter(function(l){return l.length>0}).map(function(l){return l.slice(0,200)}).slice(0,100)}
function renderQBankStatus(){var el=document.getElementById("qbank-status");if(!el)return;if(!qBank.length){el.textContent="未載入題目 · 載入後可一鍵換題";return}
el.textContent="清單 "+qBank.length+" 題 · 而家第 "+(qBankIdx<0?"—":(qBankIdx+1))+" 題"}
function setQuestionFromBank(idx){if(idx<0||idx>=qBank.length)return false;qBankIdx=idx;question=qBank[qBankIdx];if(questionEl)questionEl.value=question;publishControl();renderQBankStatus();return true}
function loadQBank(){var ta=document.getElementById("qbank");qBank=parseQBank(ta?ta.value:"");qBankIdx=-1;try{localStorage.setItem("buzzer-qbank",ta?ta.value:"")}catch(e){}
if(!qBank.length){renderQBankStatus();if(errorEl)errorEl.textContent="清單係空嘅，請每行寫一題";return}
if(!question||!String(question).trim())setQuestionFromBank(0);else renderQBankStatus();
if(errorEl&&qBank.length)errorEl.textContent="已載入 "+qBank.length+" 題 ✅"}
function nextFromBank(){if(!qBank.length){if(errorEl)errorEl.textContent="請先載入題目清單";return}
if(qBankIdx+1>=qBank.length){if(errorEl)errorEl.textContent="已到最後一題";renderQBankStatus();return}
setQuestionFromBank(qBankIdx+1);if(errorEl)errorEl.textContent=""}
function prevFromBank(){if(!qBank.length){if(errorEl)errorEl.textContent="請先載入題目清單";return}
if(qBankIdx<=0){if(errorEl)errorEl.textContent="已係第一題";renderQBankStatus();return}
setQuestionFromBank(qBankIdx-1);if(errorEl)errorEl.textContent=""}

function publishControl(){if(!channel)return;channel.publish({type:"control",phase:phase,question:question,scores:scores,buzzes:buzzes,fouls:fouls,forgiven:forgiven,passed:passed,answerActive:answerActive,answerUs:answerUs,records:records,ts:Date.now()})}
function startTimer(){clearInterval(qTimer);qTimer=setInterval(function(){if(phase!=="open")return;publishControl()},500)}
function stopTimer(){clearInterval(qTimer);qTimer=0}
function openRound(){phase="open";buzzes=[];forgiven={};for(var i=0;i<fouls.length;i++)forgiven[fouls[i]]=true;passed={};answerActive=false;answerUs=0;window._openAt=performance.now();publishControl();render();startTimer()}
function holdRound(){phase="closed";stopTimer();publishControl();render()}
function nextRound(){phase="closed";buzzes=[];passed={};stopTimer();
if(qBank.length&&qBankIdx+1<qBank.length){qBankIdx+=1;question=qBank[qBankIdx];if(questionEl)questionEl.value=question}
publishControl();render();renderQBankStatus()}
function adjustScore(id,delta){id=String(id||"");if(!id)return;scores[id]=(Number(scores[id])||0)+delta;publishControl();render()}
function acceptBuzz(d){if(phase!=="open")return;var name=d.name||"?";if(passed[name]||buzzes.some(function(b){return b.name===name}))return;
var t=performance.now();var reactionUs=d.reactionUs!=null?d.reactionUs:(t-(window._openAt||t));
buzzes.push({name:name,reactionUs:reactionUs,answerUs:d.answerUs||0,ts:Date.now()});
if(!(name in scores))scores[name]=0;
if(buzzes.length===1){answerActive=true;answerUs=0;window._answerStart=performance.now()}
publishControl();render()}
function acceptFoul(d){var name=d.name||"?";if(fouls.indexOf(name)<0)fouls.push(name);publishControl();render()}
function noteHere(d){var name=d.name||"?";if(!(name in scores))scores[name]=0;render()}
function pushRecord(name,p){var buz=buzzes.find(function(b){return b.name===name});var reactionUs=buz?buz.reactionUs:null;var t=new Date().toLocaleTimeString();
records.unshift({t:t,name:name,q:question,p:p,r:reactionUs});if(records.length>50)records.pop()}
function renderRecords(){var el=document.getElementById("records");if(!el)return;if(!records.length){el.innerHTML="<p class=\"hint\">尚未有答題紀錄</p>";return}
el.innerHTML=records.map(function(r){return "<div class=\"rec\">"+r.t+" · <b>"+r.name+"</b> · "+(r.q||"")+" · +"+r.p+(r.r!=null?" · 搶 "+Math.round(r.r)+"ms":"")+"</div>"}).join("")}
function updateQR(){var base=playerUrl();document.getElementById("join-url").value=base;if(lastQr===base)return;lastQr=base;
var box=document.getElementById("qrcode");box.innerHTML="";var img=document.createElement("img");img.width=128;img.height=128;img.alt="QR";
img.src="https://api.qrserver.com/v1/create-qr-code/?size=128x128&data="+encodeURIComponent(base);box.appendChild(img)}
function render(){statusEl.textContent=phase==="open"?"搶答中 🔥":"暫停 / 準備";
var sc=document.getElementById("scores");
var names=Object.keys(scores).sort();
if(!names.length)sc.innerHTML="<p class=\"hint\">暫無選手 · 選手入房後會出現</p>";
else sc.innerHTML=names.map(function(n){return '<div class="score-row"><span style="font-weight:700">'+n+'</span><span class="score-actions"><button type="button" class="btn-adj" data-id="'+n+'" data-adj="-5">−5</button><span class="score-num">'+(scores[n]||0)+'</span><button type="button" class="btn-adj" data-id="'+n+'" data-adj="5">+5</button></span></div>'}).join("");
var bz=document.getElementById("buzzes");
if(!buzzes.length)bz.innerHTML="<p class=\"hint\">等待搶答…</p>";
else bz.innerHTML=buzzes.map(function(b,i){return "<div>"+(i+1)+". <b>"+b.name+"</b> · "+Math.round(b.reactionUs||0)+"ms"+(i===0?" ⭐":"")+"</div>"}).join("");
renderRecords();updateQR()}

function newRoom(){var n=makeRoom();if(n===room)n=makeRoom();room=n;
var u=new URL(location.href);u.search="?room="+room;history.replaceState(null,"",u.pathname+u.search);
document.getElementById("room").textContent=room;
scores={};buzzes=[];fouls=[];passed={};forgiven={};records=[];phase="closed";question="";qBankIdx=-1;
if(channel){try{channel.unsubscribe()}catch(e){}}
if(ably){channel=ably.channels.get("quiz-"+room);
channel.subscribe("buzz",function(m){acceptBuzz(m.data||{})});
channel.subscribe("foul",function(m){acceptFoul(m.data||{})});
channel.subscribe("here",function(m){noteHere(m.data||{})});
}
lastQr="";publishControl();render();
if(errorEl)errorEl.textContent="已開新房 "+room+" · 請掃新 QR 或複製連結俾選手 ✅"}

document.getElementById("qbank-load").onclick=function(){loadQBank()};
document.getElementById("qbank-next").onclick=function(){nextFromBank()};
document.getElementById("qbank-prev").onclick=function(){prevFromBank()};
try{var savedBank=localStorage.getItem("buzzer-qbank");if(savedBank){var ta=document.getElementById("qbank");if(ta)ta.value=savedBank}}catch(e){}
renderQBankStatus();
document.getElementById("start").onclick=function(){openRound()};
document.getElementById("pause").onclick=function(){holdRound()};
document.getElementById("next").onclick=function(){nextRound()};
document.getElementById("reset").onclick=function(){if(confirm("確定清空所有分數？")){scores={};publishControl();render()}};
document.getElementById("new-room").onclick=function(){if(confirm("開新房會清空分數同紀錄，確定？"))newRoom()};
document.getElementById("copy").onclick=async function(){try{await navigator.clipboard.writeText(playerUrl());if(errorEl)errorEl.textContent="已複製連結 ✅"}catch(e){document.getElementById("join-url").select()}};
document.addEventListener("click",function(e){var b=e.target.closest("[data-adj]");if(b){adjustScore(b.getAttribute("data-id"),Number(b.getAttribute("data-adj"))||0)}});
questionEl.addEventListener("input",function(){question=questionEl.value.slice(0,200);clearTimeout(qTimer);qTimer=setTimeout(publishControl,400)});

try{
  ably=new Ably.Realtime({key:KEY,clientId:"host-"+Math.random().toString(36).slice(2)});
  channel=ably.channels.get("quiz-"+room);
  channel.subscribe("buzz",function(m){acceptBuzz(m.data||{})});
  channel.subscribe("foul",function(m){acceptFoul(m.data||{})});
  channel.subscribe("here",function(m){noteHere(m.data||{})});
  publishControl();render();updateQR();
}catch(e){errorEl.textContent="連線失敗。請檢查網絡或關閉廣告攔截後重新整理。";updateQR()}
})();
</script></body></html>
