<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主持 · 小天才搶答器</title></head>
<body style="margin:0;font-family:PingFang TC,sans-serif;background:#fff6e8;padding:24px"><p id="m">🎮 載入主持頁…</p>
<script>
(async function(){
  try{
    var a=await fetch("p1.txt?v=31"); if(!a.ok)throw new Error("p1");
    var b=await fetch("p2.txt?v=31"); if(!b.ok)throw new Error("p2");
    var s=(await a.text())+(await b.text());
    var html=decodeURIComponent(escape(atob(s)));
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById("m").textContent="載入失敗："+e.message+"。請重新整理。";
  }
})();
</script></body></html>
