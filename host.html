<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>主持 · 小天才搶答器</title>
<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#e7eef0;--card:#fff;--ink:#1c2833;--muted:#5c6b73;--line:#d5dee2;--red:#e23d4a;--green:#1f7a45}
*{box-sizing:border-box}body{margin:0;font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);padding:16px}
.wrap{max-width:1000px;margin:0 auto}.code{font-size:clamp(40px,8vw,72px);letter-spacing:.15em;margin:0;line-height:.95}
.card{background:var(--card);border-radius:18px;padding:14px;margin-top:12px;box-shadow:0 8px 24px rgba(28,40,51,.06)}
button{min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 14px;font:inherit;cursor:pointer}
.primary{background:var(--green);color:#fff;border:0}.danger{color:var(--red);border-color:transparent;background:transparent}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}.hint{color:var(--muted);font-size:13px;margin:0}
#qrcode{width:140px;height:140px;background:#fff;padding:6px;border-radius:12px;border:1px solid var(--line)}
#qrcode img,#qrcode canvas{display:block;width:128px!important;height:128px!important}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;margin:2px}
.mini{width:8px;height:8px;border-radius:50%;background:var(--green)}
textarea{width:100%;border:0;font-size:22px;font-weight:700;resize:none;background:transparent}
.err{color:var(--red)}.score-row,.time-row{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
input{min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 10px;flex:1}
</style></head><body><main class="wrap">
<header style="display:flex;justify-content:space-between;align-items:center">
<p class="hint" style="font-weight:700;letter-spacing:.12em">小天才搶答器 · 主持</p>
<span id="conn">連線中</span>
</header>
<div class="row" style="margin-top:12px">
<div><p class="hint">房號</p><p class="code" id="code">----</p></div>
<div style="flex:1;min-width:200px"><p class="hint">選手連結</p>
<div style="display:flex;gap:8px"><input id="player-link" readonly><button id="copy" type="button">複製</button></div>
<p class="hint">選手可掃 QR 入房。唔好把呢頁俾學生。</p></div>
<div><div id="qrcode"></div><p class="hint" style="text-align:center;margin-top:4px">掃碼入房</p></div>
</div>
<div class="card"><p class="hint">已連線 <span id="online-count">0</span></p><div id="online"></div></div>
<div class="card"><label class="hint" for="question">題目，選手手機會見到</label>
<textarea id="question" rows="2" maxlength="200" placeholder="這一題要問什麼？"></textarea>
<div id="stage" style="margin-top:8px"></div><p class="err" id="error"></p></div>
<div class="card"><p class="hint">分數</p><div id="scores"></div></div>
<div class="card"><p class="hint">這一題順序</p><div id="timeline"></div></div>
<div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">
<button class="danger" id="clear" type="button">清空分數</button>
<button class="danger" id="new-room" type="button">開新房</button>
</div>
</main>
<script>
const KEY="Nta7rA.R_3OIg:p4OAZ8Z8_mgfKaLTDl1rPWiKn7aMb12txQ2H2s8EuLo";

var _ac=null;
function ac(){if(!_ac)_ac=new (window.AudioContext||window.webkitAudioContext)();if(_ac.state==="suspended")_ac.resume();return _ac}
function tone(freq,dur,type,vol,delay){
  try{
    var a=ac(),t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
    o.type=type||"sine";o.frequency.value=freq;g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}
function sndBuzz(){tone(880,0.12,"square",0.22);tone(1320,0.08,"square",0.12,0.06)}
function sndFoul(){tone(180,0.22,"sawtooth",0.2);tone(120,0.18,"sawtooth",0.15,0.1)}
function sndOpen(){tone(523,0.1,"sine",0.16);tone(659,0.1,"sine",0.16,0.1);tone(784,0.16,"sine",0.18,0.2)}
function sndWin(){tone(523,0.12,"triangle",0.2);tone(659,0.12,"triangle",0.18,0.1);tone(784,0.12,"triangle",0.16,0.2);tone(1046,0.25,"triangle",0.2,0.32)}
function sndOther(){tone(440,0.1,"sine",0.1);tone(330,0.15,"sine",0.08,0.08)}
function sndJoin(){tone(660,0.08,"sine",0.12);tone(880,0.1,"sine",0.1,0.08)}
function unlockAudio(){try{ac()}catch(e){}}

const ALPH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
var ably=null,channel=null,room="",seq=0,round=1,phase="hold",question="";
var scores={},buzzes=[],fouls=[],passed={},forgiven={},online=[],seen={},lastQr="",qTimer=0;
var codeEl=document.getElementById("code"),linkEl=document.getElementById("player-link"),connEl=document.getElementById("conn");
var onlineEl=document.getElementById("online"),onlineCountEl=document.getElementById("online-count"),stage=document.getElementById("stage");
var questionEl=document.getElementById("question"),errorEl=document.getElementById("error"),scoresEl=document.getElementById("scores");
var timelineEl=document.getElementById("timeline"),qrBox=document.getElementById("qrcode");
function cleanName(r){var n=String(r||"").replace(/[\u0000-\u001f]/g,"").trim().slice(0,12);return n||"神秘玩家"}
function makeRoom(){var c="";for(var i=0;i<4;i++)c+=ALPH[Math.floor(Math.random()*ALPH.length)];return c}
function normalizeRoom(r){var c=String(r||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4);return /^[A-Z0-9]{4}$/.test(c)?c:""}
function playerUrl(){var u=new URL("index.html",location.href);u.search="?room="+room;return u.toString()}
function winner(){return buzzes.find(function(b){return !passed[b.id]})||null}
function fmtDelta(ms){return "+"+(Math.max(0,ms)/1000).toFixed(2)+"秒"}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]})}
function buzzOrder(){if(!buzzes.length)return[];var f=buzzes[0].at;return buzzes.map(function(b,i){return{id:b.id,name:b.name,place:i+1,deltaMs:Math.max(0,b.at-f)}}).slice(0,30)}
function roster(){var m={};Object.keys(scores).forEach(function(id){m[id]={id:id,name:cleanName(scores[id].name),score:Number(scores[id].score)||0}});online.forEach(function(p){if(!m[p.id])m[p.id]={id:p.id,name:p.name,score:0};else m[p.id].name=p.name});return Object.keys(m).map(function(id){return m[id]}).sort(function(a,b){return b.score-a.score||a.name.localeCompare(b.name,"zh-Hant")}).slice(0,40)}
function updateQR(){var url=room?playerUrl():"";if(!url||url===lastQr)return;lastQr=url;qrBox.innerHTML="";
if(window.QRCode){new QRCode(qrBox,{text:url,width:128,height:128,colorDark:"#1c2833",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});return}
var img=document.createElement("img");img.width=128;img.height=128;img.alt="QR";img.src="https://api.qrserver.com/v1/create-qr-code/?size=128x128&data="+encodeURIComponent(url);qrBox.appendChild(img)}
function publishControl(){if(!channel||!ably||ably.connection.state!=="connected")return;seq+=1;var cur=winner();
channel.publish("control",{seq:seq,room:room,round:round,phase:phase,question:question,winnerId:cur?cur.id:null,winnerName:cur?cur.name:null,
forgiven:Object.keys(forgiven),passed:Object.keys(passed),board:roster(),online:online.map(function(p){return p.id}),order:buzzOrder()})}
function rebuildOnline(){var now=Date.now();Object.keys(seen).forEach(function(id){if(now-seen[id].at>20000)delete seen[id]});
online=Object.keys(seen).map(function(id){return{id:id,name:seen[id].name}}).sort(function(a,b){return a.name.localeCompare(b.name,"zh-Hant")})}
function noteHere(d){var id=String((d&&d.id)||"").slice(0,48);if(!id)return;var nm=cleanName(d.name);var prev=seen[id];var was=!!(prev&&Date.now()-prev.at<12000);
seen[id]={name:nm,at:Date.now()};rebuildOnline();renderOnline();if(!was||!prev||prev.name!==nm)setTimeout(publishControl,300)}
function acceptBuzz(d){var id=String(d.id||"").slice(0,40),nm=cleanName(d.name);if(!id)return;if(buzzes.some(function(b){return b.id===id}))return;
if(phase!=="live"||fouls.some(function(f){return f.id===id})){acceptFoul({id:id,name:nm});return}
var first=!buzzes.length;buzzes.push({id:id,name:nm,at:Date.now()});if(!scores[id])scores[id]={name:nm,score:0};else scores[id].name=nm;
if(first)sndWin();else sndBuzz();publishControl();render()}
function acceptFoul(d){var id=String(d.id||"").slice(0,40),nm=cleanName(d.name);if(!id||forgiven[id]||fouls.some(function(f){return f.id===id}))return;
fouls.push({id:id,name:nm,at:Date.now()});if(!scores[id])scores[id]={name:nm,score:0};publishControl();render()}
function openRound(){if(phase==="live")return;phase="live";buzzes=[];fouls=[];passed={};forgiven={};unlockAudio();sndOpen();publishControl();render()}
function holdRound(){phase="hold";publishControl();render()}
function nextRound(award){var cur=winner();if(award&&cur){if(!scores[cur.id])scores[cur.id]={name:cur.name,score:0};scores[cur.id].score=(Number(scores[cur.id].score)||0)+10;sndWin()}
round+=1;phase="hold";buzzes=[];fouls=[];passed={};forgiven={};publishControl();render()}
function passToNext(){var cur=winner();if(!cur)return;passed[cur.id]=true;publishControl();render()}
function renderStage(){var cur=winner();if(phase!=="live"){stage.innerHTML='<button class="primary" data-act="open" type="button">開始搶答</button>';return}
if(!cur){stage.innerHTML='<p style="font-size:28px;font-weight:800;margin:8px 0">搶答中…</p><button data-act="hold" type="button">暫停</button>';return}
stage.innerHTML='<p style="font-size:36px;font-weight:800;color:var(--red);margin:8px 0">'+esc(cur.name)+'</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" data-act="award" type="button">得分 +10 下一題</button><button data-act="pass" type="button">跳過下一位</button><button data-act="hold" type="button">暫停</button></div>'}
function renderScores(){var rows=roster();if(!rows.length){scoresEl.innerHTML='<p class="hint">未有分數</p>';return}
scoresEl.innerHTML=rows.map(function(r){return '<div class="score-row"><span>'+esc(r.name)+'</span><span style="font-weight:800">'+r.score+'</span></div>'}).join("")}
function renderTimeline(){if(!buzzes.length){timelineEl.innerHTML='<p class="hint">未有人按</p>';return}
var first=buzzes[0].at;timelineEl.innerHTML=buzzes.map(function(b,i){return '<div class="time-row"><span>'+(i+1)+' '+esc(b.name)+'</span><span class="hint">'+(i?fmtDelta(b.at-first):"第一")+'</span></div>'}).join("")}
function renderOnline(){onlineCountEl.textContent=String(online.length);if(!online.length){onlineEl.innerHTML='<p class="hint">未有人連線。選手打開連結之後會出現名字。</p>';return}
onlineEl.innerHTML=online.map(function(p){return '<span class="chip"><span class="mini"></span>'+esc(p.name)+'</span>'}).join("")}
function render(){codeEl.textContent=room||"----";linkEl.value=room?playerUrl():"";connEl.textContent=(ably&&ably.connection.state==="connected"?"已連線":"連線中")+" · 第 "+round+" 題";
if(document.activeElement!==questionEl)questionEl.value=question;renderStage();renderScores();renderTimeline();renderOnline();updateQR()}
function detach(){var c=channel;channel=null;if(!c)return;try{c.unsubscribe()}catch(e){}}
function join(next,fresh){detach();room=next;seen={};online=[];if(fresh){seq=0;round=1;phase="hold";question="";scores={};buzzes=[];fouls=[];passed={};forgiven={}}
var url=new URL(location.href);url.search="?room="+room;history.replaceState(null,"",url.pathname+url.search);
if(!ably){render();updateQR();errorEl.textContent="尚未連線，無法進入頻道。請重新整理頁面。";return;}
channel=ably.channels.get("quiz-"+room);channel.subscribe("buzz",function(m){acceptBuzz(m.data||{})});channel.subscribe("foul",function(m){acceptFoul(m.data||{})});
channel.subscribe("here",function(m){noteHere(m.data||{})});publishControl();render();if(fresh)errorEl.textContent="已開新房 "+room+"。請掃 QR 或複製連結俾選手。"}
stage.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;errorEl.textContent="";var a=b.dataset.act;
if(a==="open")openRound();if(a==="hold")holdRound();if(a==="award")nextRound(true);if(a==="pass")passToNext()});
questionEl.addEventListener("input",function(){question=questionEl.value.slice(0,200);clearTimeout(qTimer);qTimer=setTimeout(publishControl,400)});
document.getElementById("copy").onclick=async function(){try{await navigator.clipboard.writeText(playerUrl())}catch(e){linkEl.select();document.execCommand("copy")}};
document.getElementById("clear").onclick=function(){if(!confirm("清空所有分數？"))return;scores={};render();publishControl()};
document.getElementById("new-room").onclick=function(){var n=makeRoom();if(n===room)n=makeRoom();join(n,true)};
var params=new URLSearchParams(location.search);room=normalizeRoom(params.get("room"))||makeRoom();
render();
if(window.Ably){
  ably=new Ably.Realtime(KEY);
  ably.connection.on(function(ch){
    render();
    if(ch.current==="connected"&&ch.previous!=="connected")publishControl();
    if(ch.current==="failed"||ch.current==="suspended")errorEl.textContent="連線失敗，請檢查網絡後重新整理";
  });
  join(room,false);
  setInterval(function(){
    var b=online.map(function(p){return p.id}).join(",");
    rebuildOnline();
    var a=online.map(function(p){return p.id}).join(",");
    renderOnline();
    if(b!==a)publishControl();
  },3000);
} else {
  errorEl.textContent="連線元件（Ably）載入失敗。請檢查網絡或關閉廣告攔截後重新整理。";
  updateQR();
}
</script></body></html>
