<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主持 · 小天才搶答器</title></head>
<body><p>載入主持頁…</p>
<script>
(async function(){
  try {
    var n=10, s="";
    for (var i=0;i<n;i++) {
      var r=await fetch("hb"+i+".txt?v=5");
      if(!r.ok) throw new Error("hb"+i);
      s+=await r.text();
    }
    var html=decodeURIComponent(escape(atob(s.replace(/\s/g,""))));
    document.open();document.write(html);document.close();
  } catch(e) { document.body.textContent="載入失敗："+e; }
})();
</script></body></html>
