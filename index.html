<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小天才搶答器</title></head>
<body style="margin:0;font-family:sans-serif;background:#fff6e8;padding:24px"><p id="m">🎮 載入中…</p>
<script>
(async function(){
  try{
    var n=12,s="";
    for(var i=0;i<n;i++){
      var r=await fetch("pc"+i+".txt?v=24");
      if(!r.ok)throw new Error("pc"+i);
      s+=await r.text();
    }
    var html=decodeURIComponent(escape(atob(s.replace(/\s/g,""))));
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById("m").textContent="載入失敗："+e}
})();
</script></body></html>
